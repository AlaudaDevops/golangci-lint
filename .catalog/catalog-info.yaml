apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tektoncd-tools-golangci-lint
  title: Tektoncd Tools - golangci-lint
  description: golangci-lint 是 Go 语言的快速多 linter 聚合工具。在 Tekton 任务镜像中作为 Go 代码静态分析的构建依赖。
  tags:
    - tool
    - go
    - lint
    - open-source-fork
  links:
    - url: https://github.com/AlaudaDevops/golangci-lint
      title: GitHub Repository
      icon: github
    - url: https://build-sonar.alauda.cn/dashboard?id=github.com-AlaudaDevops-golangci-lint
      title: SonarQube
      icon: dashboard
    - url: https://github.com/golangci/golangci-lint
      title: Upstream Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/golangci-lint
    # sonarqube plugin
    sonarqube.org/project-key: github.com-AlaudaDevops-golangci-lint
    # 开源组件代码仓库地址，格式：${url}/${project}/${repo}
    acp.cpaas.io/open-source-component-repo: https://github.com/golangci/golangci-lint
    # 开源组件的版本信息，只适用于开源组件，自研组件默认不收集版本信息,格式 ${version}
    acp.cpaas.io/open-source-component-version: v1.64.9
    # 开源组件的license信息,格式 ${license}
    acp.cpaas.io/open-source-component-license: GPL-3.0
    # 开源组件的license地址,格式 ${url}/${project}/${repo}/${license-path}
    acp.cpaas.io/open-source-component-license_url: https://github.com/golangci/golangci-lint/blob/master/LICENSE
    # backstage techdocs plugin
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: qingliu@alauda.io

    # 组件属性，区别是否部署时必带的核心组件,可选值为 core 和 plugin。
    acp.cpaas.io/functional-attributes: plugin

spec:
  type: service
  system: system:alauda-devops-system
  lifecycle: production
  owner: devops
